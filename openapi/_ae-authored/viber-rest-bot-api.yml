openapi: 3.1.0
info:
  title: Viber REST Bot API
  description: >-
    GENERATED FROM DOCUMENTATION by API Evangelist. Viber publishes no machine-readable
    contract; every operation below was read from the "Resource URL" blocks of
    https://developers.viber.com/docs/api/rest-bot-api/ on 2026-10-13. All calls are
    HTTPS POST with a JSON body and the X-Viber-Auth-Token header. Responses carry
    status (0 = success) and status_message.
  version: '2026-10-13'
  x-generated-from: documentation
  x-generated-by: api-evangelist (hand-read from docs; generate-contract-from-docs.py found no verbatim METHOD /path pattern)
  x-source: https://developers.viber.com/docs/api/rest-bot-api/
  x-last-validated: '2026-10-13'
servers:
- url: https://chatapi.viber.com/pa
security:
- ViberAuthToken: []
tags:
- name: Webhooks
- name: Messages
- name: Account
- name: Users
paths:
  /set_webhook:
    post:
      operationId: setWebhook
      summary: Set or remove the account webhook
      tags: [Webhooks]
      x-source: https://developers.viber.com/docs/api/rest-bot-api/#setting-a-webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, description: Account webhook URL (SSL required); empty string removes the webhook}
                event_types: {type: array, items: {type: string, enum: [delivered, seen, failed, subscribed, unsubscribed, conversation_started]}}
                send_name: {type: boolean}
                send_photo: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/Status'}
  /send_message:
    post:
      operationId: sendMessage
      summary: Send a message to a subscribed user
      tags: [Messages]
      description: Maximum total JSON size of the request is 30kb.
      x-source: https://developers.viber.com/docs/api/rest-bot-api/#send-message
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {$ref: '#/components/responses/Status'}
  /broadcast_message:
    post:
      operationId: broadcastMessage
      summary: Broadcast a message to up to 300 subscribed users
      tags: [Messages]
      description: Same parameters as send_message plus broadcast_list (max 300). Rate limit of 500 requests in a 10 seconds window.
      x-source: https://developers.viber.com/docs/api/rest-bot-api/#broadcast-message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [broadcast_list]
              additionalProperties: true
              properties:
                broadcast_list: {type: array, maxItems: 300, items: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Status'}
  /get_account_info:
    post:
      operationId: getAccountInfo
      summary: Get the bot account's details
      tags: [Account]
      x-source: https://developers.viber.com/docs/api/rest-bot-api/#get-account-info
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {$ref: '#/components/responses/Status'}
  /get_user_details:
    post:
      operationId: getUserDetails
      summary: Get details of a subscribed user
      tags: [Users]
      description: Can be sent twice during a 12 hours period for each user ID.
      x-source: https://developers.viber.com/docs/api/rest-bot-api/#get-user-details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Status'}
  /get_online:
    post:
      operationId: getOnline
      summary: Get online status of up to 100 users
      tags: [Users]
      x-source: https://developers.viber.com/docs/api/rest-bot-api/#get-online
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, maxItems: 100, items: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Status'}
components:
  securitySchemes:
    ViberAuthToken:
      type: apiKey
      in: header
      name: X-Viber-Auth-Token
  responses:
    Status:
      description: Action result; status 0 for success, otherwise an error code
      content:
        application/json:
          schema:
            type: object
            properties:
              status: {type: integer}
              status_message: {type: string}
            additionalProperties: true
